name: Temporary NHANES image-definition extract

on:
  push:
    paths:
      - '.github/workflows/nhanes_image_definition_extract_temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download CSV mirrors converted from official NHANES XPT files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source out
          base='https://raw.githubusercontent.com/protobi/nhanes-continuous/main'
          curl -L --fail --retry 4 "$base/Demographics/DEMO_I.csv" -o source/DEMO_I.csv
          for f in ALQ_I MCQ_I SLQ_I SMQ_I BPQ_I DIQ_I; do
            curl -L --fail --retry 4 "$base/Questionnaire/${f}.csv" -o "source/${f}.csv"
          done
          ls -lh source

      - name: Extract only variables needed for the screenshot-defined OSA and covariates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, pathlib

          source = pathlib.Path('source')
          out = pathlib.Path('out')
          out.mkdir(exist_ok=True)

          specs = {
              'DEMO_I.csv': ['SEQN','RIAGENDR','RIDAGEYR','RIDRETH3','DMDEDUC2','INDFMPIR'],
              'SLQ_I.csv':  ['SEQN','SLD012','SLQ030','SLQ040','SLQ120'],
              'SMQ_I.csv':  ['SEQN','SMQ020'],
              'ALQ_I.csv':  ['SEQN','ALQ101','ALQ110'],
              'BPQ_I.csv':  ['SEQN','BPQ020'],
              'DIQ_I.csv':  ['SEQN','DIQ010'],
              'MCQ_I.csv':  ['SEQN','MCQ160B','MCQ160C','MCQ160D','MCQ160E','MCQ160F'],
          }

          merged = {}
          order = []
          for filename, wanted in specs.items():
              with (source / filename).open('r', encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  missing = [v for v in wanted if v not in reader.fieldnames]
                  if missing:
                      raise RuntimeError(f'{filename}: missing columns {missing}; fields={reader.fieldnames}')
                  for row in reader:
                      seqn = row['SEQN'].strip()
                      if not seqn:
                          continue
                      if seqn not in merged:
                          merged[seqn] = {'SEQN': seqn}
                          order.append(seqn)
                      for variable in wanted[1:]:
                          merged[seqn][variable] = row.get(variable, '').strip()

          columns = ['SEQN'] + [
              variable
              for filename, wanted in specs.items()
              for variable in wanted[1:]
          ]
          target = out / 'nhanes_2015_2016_image_definition_raw_subset.csv'
          with target.open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=columns, extrasaction='ignore')
              writer.writeheader()
              for seqn in sorted(order, key=lambda x: int(float(x))):
                  writer.writerow(merged[seqn])

          print(f'Wrote {target}: {len(order)} rows, {len(columns)} columns')
          if len(order) != 9971:
              raise RuntimeError(f'Unexpected DEMO-based row count: {len(order)} (expected 9971)')
          PY
          sha256sum out/* | tee out/SHA256SUMS.txt
          head -n 5 out/nhanes_2015_2016_image_definition_raw_subset.csv

      - name: Upload extracted raw variables
        uses: actions/upload-artifact@v4
        with:
          name: nhanes-image-definition-raw-subset
          path: out/
          if-no-files-found: error
          retention-days: 3
