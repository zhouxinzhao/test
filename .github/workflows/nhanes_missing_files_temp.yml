name: Temporary NHANES missing files fetch

on:
  push:
    paths:
      - '.github/workflows/nhanes_missing_files_temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official missing NHANES XPT files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import pathlib, time, urllib.request
          files = {
              'UHM_D.xpt': 'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2005/DataFiles/UHM_D.xpt',
              'UHM_E.xpt': 'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2007/DataFiles/UHM_E.xpt',
              'COTNAL_E.xpt': 'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2007/DataFiles/COTNAL_E.xpt',
          }
          out = pathlib.Path('out')
          headers = {'User-Agent': 'Mozilla/5.0 NHANES research data fetch'}
          for fn, url in files.items():
              last = None
              for attempt in range(1, 5):
                  try:
                      print('Downloading', url, 'attempt', attempt)
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=120) as r:
                          payload = r.read()
                      if len(payload) < 1000 or payload.lstrip().lower().startswith(b'<!doctype html'):
                          raise RuntimeError(f'Invalid payload {len(payload)} bytes')
                      (out/fn).write_bytes(payload)
                      print('Saved', fn, len(payload))
                      break
                  except Exception as exc:
                      last = exc
                      time.sleep(attempt * 2)
              else:
                  raise RuntimeError(f'Could not download {fn}: {last!r}')
          PY
          sha256sum out/* | tee out/SHA256SUMS.txt
          ls -lh out
      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: nhanes-missing-official-xpt
          path: out/
          if-no-files-found: error
          retention-days: 3
