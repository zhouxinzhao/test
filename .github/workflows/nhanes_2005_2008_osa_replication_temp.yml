name: Temporary NHANES 2005-2008 OSA replication data fetch

on:
  push:
    paths:
      - '.github/workflows/nhanes_2005_2008_osa_replication_temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official NHANES XPT files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nhanes_2005_2008_raw
          python - <<'PY'
          import pathlib, time, urllib.request

          cycles = {
              '2005': ['DEMO_D','SLQ_D','PHTHTE_D','EPH_D','ALB_CR_D','BMX_D','SMQ_D','ALQ_D','BPQ_D','DIQ_D','MCQ_D','COT_D'],
              '2007': ['DEMO_E','SLQ_E','PHTHTE_E','EPH_E','ALB_CR_E','BMX_E','SMQ_E','ALQ_E','BPQ_E','DIQ_E','MCQ_E','COT_E'],
          }
          headers = {'User-Agent': 'Mozilla/5.0 NHANES research data fetch'}
          outdir = pathlib.Path('nhanes_2005_2008_raw')

          for year, stems in cycles.items():
              bases = [
                  f'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/{year}/DataFiles/',
                  f'https://wwwn.cdc.gov/Nchs/Nhanes/{year}-{int(year)+1}/',
              ]
              for stem in stems:
                  filename = stem + '.xpt'
                  target = outdir / filename
                  errors = []
                  for base in bases:
                      url = base + filename
                      for attempt in range(1, 4):
                          try:
                              print(f'Downloading {url} (attempt {attempt})')
                              request = urllib.request.Request(url, headers=headers)
                              with urllib.request.urlopen(request, timeout=120) as response:
                                  payload = response.read()
                              if len(payload) < 1000:
                                  raise RuntimeError(f'Unexpectedly small payload: {len(payload)} bytes')
                              target.write_bytes(payload)
                              print(f'Saved {target}: {len(payload):,} bytes')
                              break
                          except Exception as exc:
                              errors.append(f'{url} attempt {attempt}: {exc!r}')
                              time.sleep(attempt * 2)
                      if target.exists():
                          break
                  if not target.exists():
                      raise RuntimeError('Failed to download ' + filename + '\n' + '\n'.join(errors))
          PY
          ls -lh nhanes_2005_2008_raw
          sha256sum nhanes_2005_2008_raw/* | tee nhanes_2005_2008_raw/SHA256SUMS.txt

      - name: Upload official raw XPT files
        uses: actions/upload-artifact@v4
        with:
          name: nhanes-2005-2008-osa-replication-raw
          path: nhanes_2005_2008_raw/
          if-no-files-found: error
          retention-days: 3
