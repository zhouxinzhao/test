name: Temporary NHANES 2017-2018 OSA validation data fetch

on:
  push:
    paths:
      - '.github/workflows/nhanes_2017_2018_osa_validation_temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official NHANES XPT files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nhanes_2017_2018_raw
          python - <<'PY'
          import pathlib, time, urllib.request
          files = [
              'DEMO_J.xpt','SLQ_J.xpt','PHTHTE_J.xpt','EPHPP_J.xpt','FR_J.xpt',
              'ALB_CR_J.xpt','BMX_J.xpt','SMQ_J.xpt','ALQ_J.xpt',
              'BPQ_J.xpt','DIQ_J.xpt','MCQ_J.xpt'
          ]
          bases = [
              'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2017/DataFiles/',
              'https://wwwn.cdc.gov/Nchs/Nhanes/2017-2018/',
          ]
          headers = {'User-Agent': 'Mozilla/5.0 NHANES research data fetch'}
          outdir = pathlib.Path('nhanes_2017_2018_raw')
          for filename in files:
              target = outdir / filename
              errors=[]
              for base in bases:
                  url=base+filename
                  for attempt in range(1,4):
                      try:
                          print(f'Downloading {url} (attempt {attempt})')
                          req=urllib.request.Request(url,headers=headers)
                          with urllib.request.urlopen(req,timeout=120) as response:
                              payload=response.read()
                          if len(payload)<1000:
                              raise RuntimeError(f'Unexpectedly small payload: {len(payload)} bytes')
                          target.write_bytes(payload)
                          print(f'Saved {target}: {len(payload):,} bytes')
                          break
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          time.sleep(attempt*2)
                  if target.exists():
                      break
              if not target.exists():
                  raise RuntimeError('Failed to download '+filename+'\n'+'\n'.join(errors))
          PY
          sha256sum nhanes_2017_2018_raw/* | tee nhanes_2017_2018_raw/SHA256SUMS.txt
      - name: Upload official raw XPT files
        uses: actions/upload-artifact@v4
        with:
          name: nhanes-2017-2018-osa-validation-raw-with-fr
          path: nhanes_2017_2018_raw/
          if-no-files-found: error
          retention-days: 3
