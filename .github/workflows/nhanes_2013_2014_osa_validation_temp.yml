name: Temporary NHANES 2013-2014 OSA validation data fetch

on:
  push:
    paths:
      - '.github/workflows/nhanes_2013_2014_osa_validation_temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official NHANES XPT files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nhanes_2013_2014_raw
          python - <<'PY'
          import pathlib, time, urllib.request
          files = [
              'DEMO_H.xpt','SLQ_H.xpt','PHTHTE_H.xpt','EPHPP_H.xpt','SSFLRT_H.xpt',
              'ALB_CR_H.xpt','BMX_H.xpt','SMQ_H.xpt','ALQ_H.xpt','BPQ_H.xpt',
              'DIQ_H.xpt','MCQ_H.xpt'
          ]
          bases = [
              'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2013/DataFiles/',
              'https://wwwn.cdc.gov/Nchs/Nhanes/2013-2014/',
          ]
          headers = {'User-Agent': 'Mozilla/5.0 NHANES research data fetch'}
          outdir = pathlib.Path('nhanes_2013_2014_raw')
          for filename in files:
              target = outdir / filename
              errors = []
              for base in bases:
                  url = base + filename
                  for attempt in range(1,4):
                      try:
                          print(f'Downloading {url} (attempt {attempt})')
                          request = urllib.request.Request(url, headers=headers)
                          with urllib.request.urlopen(request, timeout=120) as response:
                              payload = response.read()
                          if len(payload) < 1000:
                              raise RuntimeError(f'Unexpectedly small payload: {len(payload)} bytes')
                          target.write_bytes(payload)
                          print(f'Saved {target}: {len(payload):,} bytes')
                          break
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          time.sleep(attempt * 2)
                  if target.exists():
                      break
              if not target.exists():
                  raise RuntimeError('Failed to download ' + filename + '\n' + '\n'.join(errors))
          PY
          sha256sum nhanes_2013_2014_raw/* | tee nhanes_2013_2014_raw/SHA256SUMS.txt
      - name: Upload official raw XPT files
        uses: actions/upload-artifact@v4
        with:
          name: nhanes-2013-2014-osa-validation-raw
          path: nhanes_2013_2014_raw/
          if-no-files-found: error
          retention-days: 3
