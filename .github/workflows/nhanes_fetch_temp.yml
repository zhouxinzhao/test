name: Temporary NHANES 2015-2016 fetch

on:
  push:
    paths:
      - '.github/workflows/nhanes_fetch_temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official NHANES XPT files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nhanes_raw
          python - <<'PY'
          import pathlib, time, urllib.request

          files = [
              'PHTHTE_I.xpt',
              'SSMHHT_I.xpt',
              'EPHPP_I.xpt',
              'SSFR_I.xpt',
              'SSNEON_I.xpt',
              'DEMO_I.xpt',
              'SLQ_I.xpt',
              'ALB_CR_I.xpt',
              'BMX_I.xpt',
          ]
          bases = [
              'https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2015/DataFiles/',
              'https://wwwn.cdc.gov/Nchs/Nhanes/2015-2016/',
          ]
          outdir = pathlib.Path('nhanes_raw')
          headers = {'User-Agent': 'Mozilla/5.0 NHANES research data fetch'}

          for filename in files:
              target = outdir / filename
              errors = []
              for base in bases:
                  url = base + filename
                  for attempt in range(1, 4):
                      try:
                          print(f'Downloading {url} (attempt {attempt})')
                          req = urllib.request.Request(url, headers=headers)
                          with urllib.request.urlopen(req, timeout=120) as r:
                              payload = r.read()
                          if len(payload) < 1000:
                              raise RuntimeError(f'Unexpectedly small payload: {len(payload)} bytes')
                          target.write_bytes(payload)
                          print(f'Saved {target}: {len(payload):,} bytes')
                          break
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          time.sleep(attempt * 2)
                  if target.exists():
                      break
              if not target.exists():
                  raise RuntimeError('Failed to download ' + filename + '\n' + '\n'.join(errors))
          PY
          ls -lh nhanes_raw
          sha256sum nhanes_raw/* | tee nhanes_raw/SHA256SUMS.txt

      - name: Upload raw official XPT files
        uses: actions/upload-artifact@v4
        with:
          name: nhanes-2015-2016-raw
          path: nhanes_raw/
          if-no-files-found: error
          retention-days: 3
